    <g transform="translate(100 112) scale(0.17) translate(-80 -80)">
      <path d="M 80,40 L 90,66.25 L 118.04,67.64 L 96.17,85.25 L 103.51,112.36 L 80,97 L 56.49,112.36 L 63.83,85.25 L 41.96,67.64 L 70,66.25 Z" fill="none" stroke="#d9a406" stroke-width="9" stroke-linejoin="round"/>
      <path d="M 80,40 L 90,66.25 L 118.04,67.64 L 96.17,85.25 L 103.51,112.36 L 80,97 L 56.49,112.36 L 63.83,85.25 L 41.96,67.64 L 70,66.25 Z" fill="#0b0e0c"/>
    </g>
